<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <rect width="500" height="320" rx="16" fill="#0B4D49"/>
  <!-- HSK 1 - 6 Proficiency Step Diagram -->
  <g transform="translate(60, 260)">
    <rect x="0" y="-30" width="55" height="30" rx="4" fill="#146B65"/>
    <text x="27" y="-10" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">HSK 1</text>

    <rect x="65" y="-60" width="55" height="60" rx="4" fill="#146B65"/>
    <text x="92" y="-20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">HSK 2</text>

    <rect x="130" y="-90" width="55" height="90" rx="4" fill="#0E5C57"/>
    <text x="157" y="-35" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">HSK 3</text>

    <rect x="195" y="-120" width="55" height="120" rx="4" fill="#0E5C57"/>
    <text x="222" y="-50" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">HSK 4</text>

    <rect x="260" y="-150" width="55" height="150" rx="4" fill="#F59E0B"/>
    <text x="287" y="-65" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0B4D49" text-anchor="middle">HSK 5</text>

    <rect x="325" y="-180" width="55" height="180" rx="4" fill="#DC2626"/>
    <text x="352" y="-80" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">HSK 6</text>
  </g>
  <!-- Certificate Stamp -->
  <g transform="translate(200, 30)">
    <circle cx="50" cy="50" r="34" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="50" cy="50" r="28" fill="#F59E0B"/>
    <text x="50" y="55" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#0B4D49" text-anchor="middle">CERTIFIED</text>
  </g>
</svg>

