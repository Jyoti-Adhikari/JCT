<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <rect width="500" height="320" rx="16" fill="#083330"/>
  <!-- Conference table and screen presentation -->
  <rect x="120" y="60" width="260" height="150" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <line x1="160" y1="110" x2="220" y2="110" stroke="#0B4D49" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="130" x2="300" y2="130" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="150" x2="260" y2="150" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <!-- Growth chart on screen -->
  <polyline points="260,110 290,95 320,102 350,80" stroke="#DC2626" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="350" cy="80" r="4" fill="#DC2626"/>
  <!-- Stand -->
  <line x1="250" y1="210" x2="250" y2="250" stroke="#64748B" stroke-width="4"/>
  <line x1="210" y1="250" x2="290" y2="250" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom badge -->
  <g transform="translate(140, 270)">
    <rect width="220" height="32" rx="16" fill="#146B65"/>
    <text x="110" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">EXECUTIVE & WORKPLACE</text>
  </g>
</svg>

