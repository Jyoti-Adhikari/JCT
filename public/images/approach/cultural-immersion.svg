<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <rect width="500" height="320" rx="16" fill="#083330"/>
  <!-- Cultural workshop symbols: calligraphy brush, globe, conversation -->
  <circle cx="250" cy="140" r="80" fill="#0E5C57"/>
  <!-- Stylized calligraphy brush diagonally -->
  <line x1="190" y1="200" x2="280" y2="80" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
  <polygon points="190,200 170,225 200,215" fill="#DC2626"/>
  <!-- Orbiting cultural tags -->
  <g transform="translate(100, 60)">
    <rect width="80" height="26" rx="13" fill="#FFFFFF"/>
    <text x="40" y="17" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#0B4D49" text-anchor="middle">تبادل ثقافي</text>
  </g>
  <g transform="translate(320, 60)">
    <rect width="80" height="26" rx="13" fill="#DC2626"/>
    <text x="40" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">文化交流</text>
  </g>
  <g transform="translate(200, 240)">
    <rect width="100" height="26" rx="13" fill="#F59E0B"/>
    <text x="50" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0B4D49" text-anchor="middle">Global Bridge</text>
  </g>
</svg>

