<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <rect width="500" height="320" rx="16" fill="#F0F7F6"/>
  <!-- Assessment Checklist and Growth Tracker -->
  <g transform="translate(100, 50)">
    <rect width="300" height="180" rx="12" fill="#FFFFFF" stroke="#0B4D49" stroke-opacity="0.15" stroke-width="2"/>
    <!-- Item 1 -->
    <circle cx="40" cy="45" r="12" fill="#146B65"/>
    <path d="M36 45 L39 48 L45 42" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="70" y1="45" x2="220" y2="45" stroke="#0B4D49" stroke-width="4" stroke-linecap="round"/>
    <!-- Item 2 -->
    <circle cx="40" cy="90" r="12" fill="#146B65"/>
    <path d="M36 90 L39 93 L45 87" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="70" y1="90" x2="260" y2="90" stroke="#0B4D49" stroke-width="4" stroke-linecap="round"/>
    <!-- Item 3 in progress -->
    <circle cx="40" cy="135" r="12" fill="#F59E0B"/>
    <circle cx="40" cy="135" r="4" fill="#FFFFFF"/>
    <line x1="70" y1="135" x2="190" y2="135" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(150, 255)">
    <rect width="200" height="34" rx="17" fill="#DC2626"/>
    <text x="100" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">STRUCTURED PROGRESSION</text>
  </g>
</svg>

