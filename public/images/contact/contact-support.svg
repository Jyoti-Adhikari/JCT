<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <rect width="500" height="320" rx="16" fill="#F0F7F6"/>
  <!-- Support Headset & Message Consultation motif -->
  <circle cx="250" cy="130" r="60" fill="#0B4D49"/>
  <!-- Headset band -->
  <path d="M210 130 C210 100 290 100 290 130" stroke="#F59E0B" stroke-width="5" fill="none"/>
  <!-- Ear cups -->
  <rect x="204" y="120" width="12" height="24" rx="4" fill="#DC2626"/>
  <rect x="284" y="120" width="12" height="24" rx="4" fill="#DC2626"/>
  <!-- Mic arm -->
  <path d="M210 135 L225 155 L240 155" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="242" cy="155" r="4" fill="#F59E0B"/>
  <!-- Message cards floating -->
  <g transform="translate(100, 220)">
    <rect width="300" height="50" rx="25" fill="#0B4D49"/>
    <text x="150" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Advisors Available for Placement & Inquiries</text>
  </g>
</svg>

