<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <rect width="500" height="320" rx="16" fill="#0B4D49"/>
  <!-- Score Gauge / Target Band 7.5+ -->
  <path d="M150 210 A110 110 0 0 1 350 210" stroke="#146B65" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M150 210 A110 110 0 0 1 320 130" stroke="#F59E0B" stroke-width="20" stroke-linecap="round" fill="none"/>
  <!-- Center Score Indicator -->
  <circle cx="250" cy="180" r="48" fill="#FFFFFF"/>
  <text x="250" y="176" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#0B4D49" text-anchor="middle">7.5+</text>
  <text x="250" y="196" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">TARGET BAND</text>
  <!-- 4 Skills Icons: Listening, Reading, Writing, Speaking -->
  <g transform="translate(90, 250)">
    <rect width="70" height="32" rx="8" fill="#0E5C57"/>
    <text x="35" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#99F6E4" text-anchor="middle">Listening</text>
    <rect x="80" y="0" width="70" height="32" rx="8" fill="#0E5C57"/>
    <text x="115" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#99F6E4" text-anchor="middle">Reading</text>
    <rect x="160" y="0" width="70" height="32" rx="8" fill="#0E5C57"/>
    <text x="195" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#99F6E4" text-anchor="middle">Writing</text>
    <rect x="240" y="0" width="80" height="32" rx="8" fill="#0E5C57"/>
    <text x="280" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#99F6E4" text-anchor="middle">Speaking</text>
  </g>
</svg>

