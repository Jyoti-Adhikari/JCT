<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" rx="20" fill="#0B4D49"/>
  <!-- Map Latitude & Longitude curves -->
  <ellipse cx="300" cy="200" rx="240" ry="140" stroke="#146B65" stroke-width="1.5" stroke-dasharray="6 6"/>
  <ellipse cx="300" cy="200" rx="150" ry="140" stroke="#146B65" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="60" y1="200" x2="540" y2="200" stroke="#146B65" stroke-width="1.5"/>

  <!-- Primary Hub: Amman, Jordan -->
  <g transform="translate(290, 185)">
    <circle cx="10" cy="10" r="18" fill="#DC2626" opacity="0.3"/>
    <circle cx="10" cy="10" r="10" fill="#DC2626"/>
    <circle cx="10" cy="10" r="4" fill="#FFFFFF"/>
    <!-- Label -->
    <rect x="-35" y="24" width="90" height="24" rx="6" fill="#FFFFFF"/>
    <text x="10" y="40" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#0B4D49" text-anchor="middle">AMMAN, JORDAN</text>
  </g>

  <!-- Connection Arc 1: East Asia (China) -->
  <path d="M300 195 Q420 120 480 160" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="480" cy="160" r="7" fill="#F59E0B"/>
  <rect x="440" y="180" width="80" height="22" rx="5" fill="#0E5C57" stroke="#F59E0B"/>
  <text x="480" y="195" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">East Asia</text>

  <!-- Connection Arc 2: International / Europe & Americas -->
  <path d="M300 195 Q200 120 140 160" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="140" cy="160" r="7" fill="#38BDF8"/>
  <rect x="100" y="180" width="80" height="22" rx="5" fill="#0E5C57" stroke="#38BDF8"/>
  <text x="140" y="195" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Global</text>

  <!-- Bottom banner badge -->
  <g transform="translate(150, 320)">
    <rect width="300" height="48" rx="24" fill="#083330" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="150" y="29" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      Connecting Cultures & Careers Across Borders
    </text>
  </g>
</svg>

