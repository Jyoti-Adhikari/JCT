<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" rx="20" fill="#F0F7F6"/>
  <!-- Circular ambient glow -->
  <circle cx="300" cy="200" r="160" fill="#CCFBF1" opacity="0.6"/>
  <circle cx="200" cy="140" r="80" fill="#FEF3C7" opacity="0.5"/>
  <circle cx="420" cy="240" r="90" fill="#FEE2E2" opacity="0.4"/>

  <!-- Central Emblem Display -->
  <g transform="translate(240, 110)">
    <rect width="120" height="120" rx="28" fill="#0B4D49" stroke="#F59E0B" stroke-width="3"/>
    <!-- Compass / Cross-Cultural Navigation -->
    <circle cx="60" cy="60" r="40" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="60,28 66,54 60,60 54,54" fill="#DC2626"/>
    <polygon points="60,92 66,66 60,60 54,66" fill="#F59E0B"/>
    <polygon points="28,60 54,66 60,60 54,54" fill="#FFFFFF"/>
    <polygon points="92,60 66,66 60,60 66,54" fill="#FFFFFF"/>
    <circle cx="60" cy="60" r="5" fill="#0B4D49"/>
  </g>

  <!-- 3 Pillar Badges -->
  <!-- Pillar 1: Certified Curriculum -->
  <g transform="translate(50, 260)">
    <rect width="150" height="90" rx="14" fill="#FFFFFF" stroke="#0B4D49" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle cx="36" cy="34" r="16" fill="#0B4D49"/>
    <path d="M30 34 L34 38 L42 30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="66" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0B4D49" text-anchor="middle">Standardized</text>
    <text x="36" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Curriculum</text>
  </g>

  <!-- Pillar 2: Cross Cultural Bridge -->
  <g transform="translate(225, 260)">
    <rect width="150" height="90" rx="14" fill="#FFFFFF" stroke="#0B4D49" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle cx="36" cy="34" r="16" fill="#DC2626"/>
    <!-- Handshake / bridge mark -->
    <path d="M28 34 L44 34 M36 28 L36 40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="36" y="66" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0B4D49" text-anchor="middle">Cultural Bridge</text>
    <text x="36" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Jordan to World</text>
  </g>

  <!-- Pillar 3: Purpose-Driven Outcomes -->
  <g transform="translate(400, 260)">
    <rect width="150" height="90" rx="14" fill="#FFFFFF" stroke="#0B4D49" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle cx="36" cy="34" r="16" fill="#F59E0B"/>
    <path d="M36 26 L38 31 L43 31.5 L39 35 L40 40 L36 37 L32 40 L33 35 L29 31.5 L34 31 Z" fill="#FFFFFF"/>
    <text x="36" y="66" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0B4D49" text-anchor="middle">Measurable Growth</text>
    <text x="36" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">CEFR & HSK</text>
  </g>
</svg>

