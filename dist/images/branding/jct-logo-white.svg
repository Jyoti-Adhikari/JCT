  <g transform="translate(96, 26)">
    <text x="0" y="24" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">JCT</text>
    <text x="64" y="24" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#F0FDF4" letter-spacing="-0.2">EDUCATION CENTER</text>
    <circle cx="288" cy="18" r="4" fill="#F59E0B" />
    <text x="2" y="44" font-family="'Cairo', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="0.5">مركز جي سي تي للتعليم · الأردن</text>
